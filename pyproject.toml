[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "job-pilot"
version = "0.2.0"
description = "JobPilot AI — Autonomous multi-platform job agent + Chrome extension"
readme = "README.md"
authors = [
  { name = "meteor314" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2",
  "playwright>=1.58.0",
  "anthropic>=0.42",
  "python-jobspy>=1.1.75",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/TechWithTy/indeed_bot"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["apps/backend", "apps/agent"]
