<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>JobPilot</h1>
    <span id="status-badge" class="badge idle" data-i18n="status_idle">Idle</span>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-value" id="applied-count">0</span>
      <span class="stat-label">Aplicadas</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="pending-count">0</span>
      <span class="stat-label">Pendentes</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="total-count">0</span>
      <span class="stat-label">Total</span>
    </div>
  </div>

  <div id="progress-section" class="progress-section" style="display:none">
    <div id="link-info" class="link-info"></div>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div id="current-job" class="current-job" style="display:none">
    <span class="label">Atual:</span>
    <span id="current-job-text"></span>
  </div>

  <div class="controls">
    <button id="btn-pause" class="btn btn-secondary" style="display:none">Pausar</button>
    <button id="btn-resume" class="btn btn-primary" style="display:none">Retomar</button>
    <button id="btn-stop" class="btn btn-danger" style="display:none">Parar</button>
  </div>

  <div class="log-container">
    <h2>Log</h2>
    <div id="log" class="log"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
