<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot Sandbox</title>
<style>
  :root {
    --bg: #0f0f1a;
    --panel: #16213e;
    --panel-alt: #1a1a2e;
    --accent: #e94560;
    --accent-dim: rgba(233,69,96,.15);
    --text: #e0e0e0;
    --text-dim: #888;
    --border: #2a2a4a;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --cyan: #22d3ee;
    --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui,-apple-system,sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-rows: 52px 1fr 40px minmax(140px,25vh);
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }
  #status-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .status-idle     { background: var(--border); color: var(--text-dim); }
  .status-applying { background: rgba(34,211,238,.15); color: var(--cyan); }
  .status-paused   { background: rgba(250,204,21,.15); color: var(--yellow); }
  .status-done     { background: rgba(74,222,128,.15); color: var(--green); }
  .status-error    { background: rgba(248,113,113,.15); color: var(--red); }
  #job-info {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #job-info strong { color: var(--text); }
  #conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }
  #conn-dot.connected { background: var(--green); }

  /* ── Main panels ── */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }

  .panel {
    background: var(--panel-alt);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .panel-header .tab {
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
    transition: all .15s;
  }
  .panel-header .tab:hover { color: var(--text); }
  .panel-header .tab.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* Browser panel */
  #browser-panel .panel-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    background: #000;
  }
  #screenshot {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
    image-rendering: auto;
  }
  #no-browser {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
  }
  #no-browser div { font-size: 40px; margin-bottom: 10px; opacity: .4; }

  /* Inspector panel */
  #inspector-body {
    flex: 1;
    overflow: auto;
    padding: 0;
  }
  #inspector-body pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 10px 14px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text-dim);
    min-height: 100%;
  }
  .dom-tag { color: var(--cyan); }
  .dom-attr { color: var(--yellow); }
  .dom-str { color: var(--green); }
  #search-box {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    outline: none;
    width: 140px;
    margin-left: auto;
  }
  #search-box:focus { border-color: var(--accent); }

  /* ── Controls bar ── */
  #controls {
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .ctrl-btn {
    font-size: 11px;
    padding: 4px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    transition: all .15s;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #step-counter {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ── Log panel ── */
  #log-panel {
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #log-panel .panel-header {
    background: var(--panel);
  }
  #log-entries {
    flex: 1;
    overflow-y: auto;
    padding: 6px 14px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
  }
  .log-entry { display: flex; gap: 8px; }
  .log-ts { color: var(--text-dim); flex-shrink: 0; }
  .log-type { font-weight: 700; flex-shrink: 0; min-width: 80px; }
  .log-msg { color: var(--text-dim); }
  .t-navigate  { color: var(--cyan); }
  .t-click     { color: var(--green); }
  .t-fill      { color: var(--green); }
  .t-select    { color: var(--green); }
  .t-upload    { color: var(--yellow); }
  .t-ai        { color: var(--yellow); }
  .t-error     { color: var(--red); }
  .t-done      { color: var(--green); }
  .t-control   { color: var(--accent); }
  .t-info      { color: var(--text-dim); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1>JOBPILOT SANDBOX</h1>
  <span id="status-badge" class="status-idle">idle</span>
  <span id="job-info">Waiting for pipeline...</span>
  <span id="conn-dot" title="WebSocket"></span>
</header>

<main>
  <!-- Browser view -->
  <div class="panel" id="browser-panel">
    <div class="panel-header">Browser</div>
    <div class="panel-body">
      <img id="screenshot" style="display:none" alt="Browser">
      <div id="no-browser">
        <div>&#9881;</div>
        Waiting for browser...<br>
        <small>Run with <code>--sandbox</code> to start</small>
      </div>
    </div>
  </div>

  <!-- Inspector -->
  <div class="panel" id="inspector-panel">
    <div class="panel-header">
      <span class="tab active" data-tab="context">AI Context</span>
      <span class="tab" data-tab="dom">DOM</span>
      <input id="search-box" type="text" placeholder="Search...">
    </div>
    <div id="inspector-body">
      <pre id="inspector-content">Waiting for page data...</pre>
    </div>
  </div>
</main>

<div id="controls">
  <button class="ctrl-btn" id="btn-pause" onclick="sendCmd('pause')">&#9208; Pause</button>
  <button class="ctrl-btn" id="btn-resume" onclick="sendCmd('resume')">&#9654; Resume</button>
  <button class="ctrl-btn" id="btn-skip" onclick="sendCmd('skip')">&#9197; Skip Job</button>
  <button class="ctrl-btn" id="btn-dom" onclick="fetchDom()">&#8635; Refresh DOM</button>
  <span id="step-counter"></span>
</div>

<div id="log-panel">
  <div class="panel-header">Activity Log</div>
  <div id="log-entries"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ── State ──
let activeTab = 'context';
let domCache = '';
let contextCache = '';
let stepCount = 0;

// ── Tabs ──
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    renderInspector();
  });
});

function renderInspector() {
  const el = $('#inspector-content');
  if (activeTab === 'dom') {
    el.textContent = domCache || 'Click "Refresh DOM" to load...';
  } else {
    el.textContent = contextCache || 'Waiting for page context...';
  }
}

// ── Search ──
$('#search-box').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const el = $('#inspector-content');
  if (!q) { renderInspector(); return; }
  const text = activeTab === 'dom' ? domCache : contextCache;
  const lines = text.split('\n');
  const filtered = lines.filter(l => l.toLowerCase().includes(q));
  el.textContent = filtered.length ? filtered.join('\n') : 'No matches';
});

// ── Controls ──
async function sendCmd(cmd) {
  try { await fetch('/api/control/' + cmd, { method: 'POST' }); }
  catch(e) { addLog('error', 'Control failed: ' + e.message); }
}

async function fetchDom() {
  try {
    const r = await fetch('/api/dom');
    const d = await r.json();
    domCache = d.dom || '';
    if (activeTab === 'dom') renderInspector();
    addLog('info', 'DOM refreshed (' + domCache.length + ' chars)');
  } catch(e) {
    addLog('error', 'DOM fetch failed: ' + e.message);
  }
}

// ── Log ──
function addLog(type, msg) {
  const el = $('#log-entries');
  const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML =
    '<span class="log-ts">' + now + '</span>' +
    '<span class="log-type t-' + type + '">[' + type.toUpperCase() + ']</span>' +
    '<span class="log-msg">' + escapeHtml(msg) + '</span>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

  // keep max 300 entries
  while (el.children.length > 300) el.removeChild(el.firstChild);
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ── Status badge ──
function updateStatus(status, paused) {
  const badge = $('#status-badge');
  const s = paused ? 'paused' : status;
  badge.textContent = s;
  badge.className = 'status-' + (
    s === 'idle' ? 'idle' :
    s === 'paused' ? 'paused' :
    s === 'applying' ? 'applying' :
    s === 'applied' || s === 'done' ? 'done' : 'error'
  );
}

function updateJob(job) {
  const el = $('#job-info');
  if (!job) { el.textContent = 'Waiting for pipeline...'; return; }
  el.innerHTML =
    '<strong>' + escapeHtml(job.title || '') + '</strong>' +
    ' at ' + escapeHtml(job.company || '') +
    (job.score ? ' &middot; Score: ' + job.score : '');
}

// ── WebSocket ──
function connectWS() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  const dot = $('#conn-dot');

  ws.onopen = () => {
    dot.classList.add('connected');
    addLog('info', 'Connected to sandbox');
  };

  ws.onclose = () => {
    dot.classList.remove('connected');
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    // Screenshot frame
    if (msg.type === '_frame' && msg.data.b64) {
      const img = $('#screenshot');
      img.src = 'data:image/png;base64,' + msg.data.b64;
      img.style.display = 'block';
      $('#no-browser').style.display = 'none';
      return;
    }

    // Status update
    if (msg.type === '_status') {
      updateStatus(msg.data.status, msg.data.paused);
      updateJob(msg.data.job);
      return;
    }

    // Pipeline events
    const d = msg.data || {};
    switch (msg.type) {
      case 'navigate':
        addLog('navigate', d.url || '');
        break;
      case 'click':
        addLog('click', d.selector || '');
        stepCount++;
        break;
      case 'fill':
        addLog('fill', (d.selector || '') + ' = "' + (d.value || '') + '"');
        stepCount++;
        break;
      case 'select':
        addLog('select', (d.selector || '') + ' = "' + (d.value || '') + '"');
        stepCount++;
        break;
      case 'upload':
        addLog('upload', (d.selector || '') + ' ← ' + (d.file || ''));
        stepCount++;
        break;
      case 'ai_thinking':
        addLog('ai', 'Analyzing page (step ' + (d.step || 0) + ')...');
        break;
      case 'ai_action':
        addLog('ai', (d.thought || d.reason || d.action || ''));
        // Update context with AI's view
        if (d.thought) {
          contextCache = 'Step ' + (d.step||0) + ': ' + d.action + '\n' +
                         'Thought: ' + d.thought + '\n' +
                         'Selector: ' + (d.selector||'-') + '\n' +
                         'Value: ' + (d.value||'-') + '\n\n' + contextCache;
          if (activeTab === 'context') renderInspector();
        }
        break;
      case 'page_context':
        contextCache = d.context || '';
        if (activeTab === 'context') renderInspector();
        break;
      case 'completed':
        addLog('done', (d.status || '') + ': ' + (d.reason || ''));
        break;
      case 'error':
      case 'action_error':
        addLog('error', d.error || d.message || JSON.stringify(d));
        break;
      case 'control':
        addLog('control', d.action || '');
        break;
      case 'browser_started':
        addLog('info', 'Browser started');
        break;
      case 'browser_stopped':
        addLog('info', 'Browser stopped');
        $('#screenshot').style.display = 'none';
        $('#no-browser').style.display = '';
        break;
      default:
        addLog('info', msg.type + ': ' + JSON.stringify(d).substring(0, 120));
    }

    $('#step-counter').textContent = 'Steps: ' + stepCount;
  };
}

connectWS();

// Fetch initial state
fetch('/api/state').then(r => r.json()).then(s => {
  if (s.screenshot) {
    $('#screenshot').src = 'data:image/png;base64,' + s.screenshot;
    $('#screenshot').style.display = 'block';
    $('#no-browser').style.display = 'none';
  }
  if (s.dom) domCache = s.dom;
  if (s.context) { contextCache = s.context; renderInspector(); }
  updateStatus(s.status, s.paused);
  updateJob(s.job);
}).catch(() => {});
</script>
</body>
</html>
